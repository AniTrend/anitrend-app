name: android-unit-test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches:
      - '*'

jobs:
  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Changelog Character Limits
        run: bash .github/scripts/validate-changelogs.sh
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build retrofit-graphql plugin from source
        run: |
          git clone --depth 1 --branch 0.12.1 https://github.com/AniTrend/retrofit-graphql.git ../retrofit-graphql
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Configure properties
        run: bash .github/scripts/setup-config.sh
      - name: Spotless check
        run: ./gradlew :app:spotlessCheck --stacktrace
      - name: Test with Gradle
        run: ./gradlew test --stacktrace
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
